<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hirschfelden – mapa stád</title>
<style>
:root{--bg:#f6f5f1;--pn:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#dcdad2;--ac:#c2631f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--pn:#202326;--tx:#ececE8;--mu:#9a9a94;--bd:#33373b;--ac:#e8883a}}
:root[data-theme="dark"]{--bg:#16181a;--pn:#202326;--tx:#ececE8;--mu:#9a9a94;--bd:#33373b;--ac:#e8883a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%}
aside{width:340px;max-width:42%;background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
h1{font-size:16px;margin:0}h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 6px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.on{outline:2px solid var(--ac)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:4px 10px;font-size:13px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.item{padding:8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer}
.item.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.item small{color:var(--mu);display:block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:3px}
#ed{border:1px solid var(--ac);border-radius:8px;padding:10px;display:none;flex-direction:column;gap:8px}
#ed input,#ed textarea,#ed select{width:100%}
.an{display:grid;grid-template-columns:1.1fr .6fr .9fr auto auto auto;gap:4px}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#1b6f95}
#vp.add{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img{display:block;user-select:none;-webkit-user-drag:none;max-width:none}
.pin{position:absolute;width:0;height:0;transform:scale(var(--inv,1));transform-origin:0 0;cursor:pointer}
.dotc{position:absolute;left:-7.5px;top:-7.5px;width:15px;height:15px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;color:#fff;font:700 9px system-ui;text-shadow:0 0 3px #000}
.pin.sel .dotc{box-shadow:0 0 0 3px #ffd60a}
.ic{position:absolute;left:-13px;top:-13px;filter:drop-shadow(0 0 2px #000)}
.pin.sel .ic{filter:drop-shadow(0 0 4px #ffd60a) drop-shadow(0 0 2px #000)}
.pin.sel{z-index:5}
.pin span{pointer-events:none}
.lbl{position:absolute;left:0;top:0;background:rgba(20,20,20,.86);color:#fff;font:600 11px/1.35 system-ui;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;text-shadow:none}
.lbl i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.lbl.gr{border:1px solid #39ff14;padding:2px 6px}
.lbl.go{border:1px solid #ff8c00;padding:2px 6px}
.lbl.gd{border:1px solid #00e5ff;padding:2px 6px}
.lbl .solo{color:#ff5c5c;font-weight:700}
.solo{color:#e03131;font-weight:600}
.sl{display:flex;align-items:center;gap:2px;font-weight:700;color:#e03131}
#ed .an input[type=checkbox]{width:auto}
.sh{display:flex;align-items:center;gap:2px;font-weight:700;color:#9b30d9}
.an>*{min-width:0}
#mv{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--pn);border:2px solid var(--ac);border-radius:8px;padding:6px 10px;display:none;gap:8px;align-items:center;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.shot{color:#9b30d9;text-decoration:line-through}
.lbl .shot{color:#c77dff;font-weight:600;text-decoration:line-through}
#zm{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
#hint{position:absolute;left:10px;bottom:10px;background:var(--pn);padding:4px 10px;border-radius:6px;font-size:12px;display:none}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:10px;width:min(520px,92vw)}
dialog textarea{width:100%;height:220px;font:12px monospace}
@media (max-width:700px){#app{flex-direction:column-reverse}aside{width:100%;max-width:none;height:46%;border-right:0;border-top:1px solid var(--bd)}}
</style></head><body>
<div id="app">
<aside>
 <div class="row" style="justify-content:space-between"><h1>Hirschfelden – stáda</h1><button id="bk">Záloha</button></div>
 <div class="row"><button id="addb" class="pri">+ Stádo</button><button id="addn" class="pri">+ Stan</button><button id="addq" class="pri">+ Otáznik</button><button id="addd" class="pri">+ Diamant</button></div>
 <div><h2>Filter druhov</h2><div id="chips" class="row"></div><h2 style="margin-top:12px">Filter gradu</h2><div id="gchips" class="row"></div><label class="row" style="margin-top:8px"><input type="checkbox" id="hs"> Nezobrazovať solo</label><label class="row" style="margin-top:4px"><input type="checkbox" id="hn"> Nezobrazovať normal</label></div>
 <div id="ed"></div>
 <div><h2 id="cnt">Stáda</h2><div id="list"></div></div>

<script>
const SP=[["Canada Goose",1,"#7b8794"],["European Rabbit",1,"#b08968"],["Red Fox",2,"#e4572e"],["Roe Deer",3,"#d4a373"],["Fallow Deer",4,"#f2cc8f"],["Wild Boar",4,"#6d4c41"],["Red Deer",6,"#c1121f"],["European Bison",9,"#4361ee"]];
const col=n=>(SP.find(s=>s[0]===n)||[0,0,"#888"])[2];
const KEY="cotw-hirschfelden-v1";
let herds=[],sel=null,act=new Set(),addMode=false,hideSolo=false,hideNorm=false,gAct=new Set();
try{herds=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){herds=[]}
herds.forEach(h=>{if(h.type==="tripod")h.type="stan"});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(herds))}catch(e){}};
const $=id=>document.getElementById(id);
const vp=$("vp"),world=$("world"),img=$("map");
let W=1,H=1,tx=0,ty=0,s=1,fit=1,drag=null,moved=false,lastS=0,pd=null,pend=null;
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;world.style.setProperty("--inv",1/s);if(s!==lastS){lastS=s;layout()}}
function init(){W=img.naturalWidth;H=img.naturalHeight;$("pins").style.cssText=`position:absolute;left:0;top:0;width:${W}px;height:${H}px`;fitView();renderAll()}
function fitView(){const r=vp.getBoundingClientRect();fit=Math.min(r.width/W,r.height/H);s=fit;tx=(r.width-W*s)/2;ty=(r.height-H*s)/2;apply()}
function zoomAt(cx,cy,f){const ns=Math.min(6,Math.max(fit*.8,s*f));tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;apply()}
vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.2:1/1.2)},{passive:false});
vp.addEventListener("pointerdown",e=>{moved=false;if(e.target.closest("#zm"))return;const p=e.target.closest(".pin");if(p){if(pend)return;const q=herds.find(z=>z.id===p.dataset.id);pd={id:p.dataset.id,x:e.clientX,y:e.clientY,ox:q?q.x:0,oy:q?q.y:0};return}drag={x:e.clientX,y:e.clientY,tx,ty}});
window.addEventListener("pointermove",e=>{if(pd){if(Math.abs(e.clientX-pd.x)+Math.abs(e.clientY-pd.y)>5)moved=true;if(moved){const h=herds.find(q=>q.id===pd.id),r=vp.getBoundingClientRect();if(h){h.x=Math.min(1,Math.max(0,(e.clientX-r.left-tx)/s/W));h.y=Math.min(1,Math.max(0,(e.clientY-r.top-ty)/s/H));renderPins()}}return}if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(moved){tx=drag.tx+dx;ty=drag.ty+dy;apply()}});
window.addEventListener("pointerup",()=>{if(pd&&moved&&herds.find(q=>q.id===pd.id)){pend={id:pd.id,x:pd.ox,y:pd.oy};$("mv").style.display="flex"}pd=null;drag=null});
vp.addEventListener("click",e=>{
 if(moved){moved=false;return}
 if(e.target.closest("#zm"))return;
 const p=e.target.closest(".pin");
 if(p){select(p.dataset.id);return}
 if(addMode){const r=vp.getBoundingClientRect();
  const h={id:String(Date.now()),x:(e.clientX-r.left-tx)/s/W,y:(e.clientY-r.top-ty)/s/H,type:addType,title:addType==="stan"?"Stan":addType==="otaznik"?"Otáznik":addType==="diamant"?"Diamant":"Nové stádo",note:"",animals:[{sp:SP[3][0],grade:"",rating:"",solo:false,shot:false}]};
  if(h.x<0||h.x>1||h.y<0||h.y>1)return;
  herds.push(h);setAdd(false);save();select(h.id)}
});
$("zi").onclick=()=>{const r=vp.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.4)};
$("zo").onclick=()=>{const r=vp.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.4)};
$("zf").onclick=fitView;
$("mok").onclick=()=>{pend=null;$("mv").style.display="none";save()};
$("mno").onclick=()=>{if(pend){const h=herds.find(q=>q.id===pend.id);if(h){h.x=pend.x;h.y=pend.y}}pend=null;$("mv").style.display="none";renderPins()};
$("hs").onchange=e=>{hideSolo=e.target.checked;renderAll()};
$("hn").onchange=e=>{hideNorm=e.target.checked;renderAll()};
let addType=null;
function setAdd(t){addType=t||null;addMode=!!t;vp.classList.toggle("add",addMode);[["addb","stado"],["addn","stan"],["addq","otaznik"],["addd","diamant"]].forEach(([i,k])=>$(i).classList.toggle("on",t===k));$("hint").style.display=t?"block":"none"}
$("addb").onclick=()=>setAdd(addType==="stado"?null:"stado");$("addn").onclick=()=>setAdd(addType==="stan"?null:"stan");$("addq").onclick=()=>setAdd(addType==="otaznik"?null:"otaznik");$("addd").onclick=()=>setAdd(addType==="diamant"?null:"diamant");
const an=h=>h.animals.filter(a=>!(hideSolo&&a.solo)&&!(hideNorm&&!a.solo)&&(!gAct.size||gAct.has(String(a.grade||"").trim())));
const vis=h=>{const l=an(h);if((gAct.size||((hideSolo||hideNorm)&&h.animals.length))&&!l.length)return false;return !act.size||l.some(a=>act.has(a.sp))};
function renderChips(){
 $("chips").innerHTML=SP.map(([n,c,k])=>`<button class="chip ${act.has(n)?"on":""}" data-n="${n}"><i style="background:${k}"></i>${n}</button>`).join("")+(act.size?`<button class="chip" data-n="">Zrušiť filter</button>`:"");
 $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(!n)act.clear();else act.has(n)?act.delete(n):act.add(n);renderAll()})}
function ico(h,bg,t){
 if(t==="stado")return `<div class="dotc" style="background:${bg}"><span>${an(h).length>1?an(h).length:""}</span></div>`;
 const g=t==="diamant"?`<path d="M7 3h10l5 6-10 12L2 9zM2 9h20M8 9l4 12 4-12"/>`:t==="otaznik"?`<circle cx="12" cy="12" r="10"/><path d="M8.5 9.5a3.5 3.5 0 1 1 5.5 2.8c-1.2.8-2 1.4-2 3M12 19v.01"/>`:`<path d="M2 21L12 3l10 18zM9.5 21L12 14l2.5 7"/>`;
 return `<svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="rgba(0,0,0,.35)" stroke="${t==="otaznik"?"#ff8c00":t==="diamant"?"#00e5ff":"#39ff14"}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${g}</svg>`}
function lab(h,t){
 
 return an(h).map(a=>`<div class="${a.shot?"shot":a.solo?"solo":""}"><i style="background:${col(a.sp)}"></i>${a.sp}${a.grade?" · "+esc(a.grade):""}${a.rating?" · "+esc(a.rating):""}</div>`).join("")||`<div>${esc(h.title)}</div>`}
function pinHtml(h,bg){const t=h.type||"stado";
 return `<div class="pin ${h.id===sel?"sel":""}" data-id="${h.id}" data-x="${h.x}" data-y="${h.y}" title="${esc(h.title)}" style="left:${h.x*W}px;top:${h.y*H}px">${ico(h,bg,t)}<div class="lbl ${t==="stan"?"gr":t==="otaznik"?"go":t==="diamant"?"gd":""}">${lab(h,t)}</div></div>`}
function layout(){
 const R=14,its=[...document.querySelectorAll(".pin")].map(p=>{const l=p.querySelector(".lbl");return{p,l,x:p.dataset.x*W*s,y:p.dataset.y*H*s,w:l.offsetWidth+2,h:l.offsetHeight+2}});
 its.sort((a,b)=>(b.p.classList.contains("sel")-a.p.classList.contains("sel"))||a.y-b.y);
 const ov=(a,b)=>Math.max(0,Math.min(a.x2,b.x2)-Math.max(a.x1,b.x1))*Math.max(0,Math.min(a.y2,b.y2)-Math.max(a.y1,b.y1));
 const ic=its.map(i=>({x1:i.x-R,y1:i.y-R,x2:i.x+R,y2:i.y+R})),pl=[];
 its.forEach((it,k)=>{const w=it.w,h=it.h,g=R+2;
  const cs=[[g,-h/2],[-g-w,-h/2],[-w/2,g],[-w/2,-g-h],[g,g-4],[-g-w,g-4],[g,-g-h+4],[-g-w,-g-h+4],[-w/2,g+h],[-w/2,-g-2*h]];
  let best=cs[0],bs=1e18;
  for(const c of cs){const r={x1:it.x+c[0],y1:it.y+c[1],x2:it.x+c[0]+w,y2:it.y+c[1]+h};
   let sc=0;pl.forEach(q=>sc+=ov(r,q));ic.forEach((q,j)=>{if(j!==k)sc+=ov(r,q)});
   if(sc<bs){bs=sc;best=c;best.r=r;if(!sc)break}}
  pl.push(best.r);it.l.style.left=best[0]+"px";it.l.style.top=best[1]+"px"})}
function renderPins(){renderPins0();layout()}
function renderPins0(){
 $("pins").innerHTML=herds.filter(vis).map(h=>{
  const cs=[...new Set(h.animals.map(a=>col(a.sp)))];
  const bg=cs.length>1?`conic-gradient(${cs.map((c,i)=>`${c} ${i*100/cs.length}% ${(i+1)*100/cs.length}%`).join(",")})`:(cs[0]||"#888");
  return pinHtml(h,bg);`<div class="pin"><span>${h.animals.length>1?h.animals.length:""}</span><div class="lbl">${h.animals.map(a=>`<div><i style="background:${col(a.sp)}"></i>${a.sp}${a.grade?" · "+esc(a.grade):""}${a.rating?" · "+esc(a.rating):""}</div>`).join("")}</div></div>`}).join("")}
function renderList(){
 const v=herds.filter(vis);$("cnt").textContent=`Stáda (${v.length}/${herds.length})`;
 $("list").innerHTML=v.map(h=>`<div class="item ${h.id===sel?"sel":""}" data-id="${h.id}"><b>${esc(h.title)}</b>${h.type&&h.type!=="stado"?` <small style="display:inline">(${h.type})</small>`:""}<small>${an(h).map(a=>`<span class="${a.shot?"shot":a.solo?"solo":""}"><span class="dot" style="background:${col(a.sp)}"></span>${a.sp}${a.grade?" · "+esc(a.grade):""}${a.rating?" · "+esc(a.rating):""}</span>`).join("<br>")}</small>${h.note?`<small>${esc(h.note).slice(0,90)}</small>`:""}</div>`).join("")||`<small style="color:var(--mu)">Žiadne stáda. Klikni na „Pridať stádo“.</small>`;
 $("list").querySelectorAll(".item").forEach(i=>i.onclick=()=>{select(i.dataset.id,true)})}
function renderEd(){
 const ed=$("ed"),h=herds.find(x=>x.id===sel);
 if(!h){ed.style.display="none";return}
 ed.style.display="flex";const T=h.type||"stado";
 ed.innerHTML=`<h2>Úprava</h2><select id="ty"><option value="stado" ${T==="stado"?"selected":""}>Stádo</option><option value="stan" ${T==="stan"?"selected":""}>Stan</option><option value="otaznik" ${T==="otaznik"?"selected":""}>Otáznik</option><option value="diamant" ${T==="diamant"?"selected":""}>Diamant</option></select><input id="t" value="${esc(h.title)}" placeholder="Názov / lokalita">
 <div id="ans">${h.animals.map((a,i)=>`<div class="an" data-i="${i}"><select>${SP.map(x=>`<option ${x[0]===a.sp?"selected":""}>${x[0]}</option>`).join("")}</select><input placeholder="Grade" value="${esc(a.grade)}"><input placeholder="Hodnotenie" value="${esc(a.rating)}"><label class="sl" title="Solo"><input type="checkbox" ${a.solo?"checked":""}>S</label><label class="sh" title="Zastrelený"><input type="checkbox" ${a.shot?"checked":""}>Z</label><button title="Odstrániť">✕</button></div>`).join("")}</div>
 <button id="aa">+ Pridať druh</button>
 <textarea id="n" rows="4" placeholder="Poznámka (čas, počet kusov, kožušina…)">${esc(h.note)}</textarea>
 <div class="row"><button id="dn" class="pri">Hotovo</button><button id="dl">Zmazať stádo</button></div>`;
 $("t").oninput=e=>{h.title=e.target.value;upd()};
 $("n").oninput=e=>{h.note=e.target.value;upd()};
 $("ty").onchange=e=>{h.type=e.target.value;if(!h.animals.length)h.animals.push({sp:SP[0][0],grade:"",rating:"",solo:false,shot:false});upd();renderEd()};
 ed.querySelectorAll(".an").forEach(r=>{const a=h.animals[r.dataset.i];
  r.querySelector("select").onchange=e=>{a.sp=e.target.value;upd()};
  const ii=r.querySelectorAll("input");ii[0].oninput=e=>{a.grade=e.target.value;upd()};ii[1].oninput=e=>{a.rating=e.target.value;upd()};ii[2].onchange=e=>{a.solo=e.target.checked;upd()};ii[3].onchange=e=>{a.shot=e.target.checked;upd()};
  r.querySelector("button").onclick=()=>{h.animals.splice(r.dataset.i,1);upd();renderEd()}});
 if($("aa"))$("aa").onclick=()=>{h.animals.push({sp:SP[0][0],grade:"",rating:"",solo:false});upd();renderEd()};
 $("dn").onclick=()=>{sel=null;renderAll()};
 $("dl").onclick=()=>{if(confirm("Zmazať toto stádo?")){herds=herds.filter(x=>x!==h);sel=null;save();renderAll()}}}
function upd(){save();renderG();renderPins();renderList()}
function select(id,center){sel=id;const h=herds.find(x=>x.id===id);
 if(center&&h){const r=vp.getBoundingClientRect();s=Math.max(s,fit*2);tx=r.width/2-h.x*W*s;ty=r.height/2-h.y*H*s;apply()}
 renderAll()}
function renderG(){const gs=[...new Set([...herds.flatMap(h=>h.animals.map(a=>String(a.grade||"").trim())),...gAct])].filter(Boolean).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
 $("gchips").innerHTML=gs.length?gs.map(g=>`<button class="chip ${gAct.has(g)?"on":""}" data-g="${esc(g)}">${esc(g)}</button>`).join("")+(gAct.size?`<button class="chip" data-g="">Zrušiť filter</button>`:""):`<small style="color:var(--mu)">Zatiaľ žiadny grade</small>`;
 $("gchips").querySelectorAll("button").forEach(b=>b.onclick=()=>{const g=b.dataset.g;if(!g)gAct.clear();else gAct.has(g)?gAct.delete(g):gAct.add(g);renderAll()})}
function renderAll(){renderChips();renderG();renderPins();renderList();renderEd()}
$("bk").onclick=()=>{$("js").value=JSON.stringify(herds,null,1);$("dlg").showModal()};
$("cl").onclick=()=>$("dlg").close();
$("cp").onclick=()=>{$("js").select();try{navigator.clipboard.writeText($("js").value)}catch(e){document.execCommand("copy")}};
$("ld").onclick=()=>{try{const d=JSON.parse($("js").value);if(!Array.isArray(d))throw 0;herds=d;herds.forEach(h=>{if(h.type==="tripod")h.type="stan"});sel=null;save();renderAll();$("dlg").close()}catch(e){alert("Neplatný JSON")}};
img.complete&&img.naturalWidth?init():img.addEventListener("load",init);
window.addEventListener("resize",()=>{if(s<fit)fitView()});
</script></body></html>
